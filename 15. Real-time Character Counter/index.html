<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="writing-container">
        <h1>Real-time Character Counter</h1>
        <textarea name="" id="" placeholder="Please write your text here..." maxlength="150"></textarea>
        <div class="counter-div">
            <span id="total-character">Total Character: <span id="total-count">30</span></span>
            <span id="remaining-character">Remaining: <span id="remaining-count">20</span></span>
        </div>

        
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- lorem picsum for random images -->
        <span style="--i: 1"><img src="https://picsum.photos/id/478/300/200"  alt="1"></span>
        <span style="--i: 2"><img src="https://picsum.photos/id/45/300/200" alt="2"></span>
        <span style="--i: 3"><img src="https://picsum.photos/id/12/300/200" alt="3"></span>
        <span style="--i: 4"><img src="https://picsum.photos/id/23/300/200" alt="4"></span>
        <span style="--i: 5"><img src="https://picsum.photos/id/8/300/200"  alt="5"></span>
        <span style="--i: 6"><img src="https://picsum.photos/id/47/300/200" alt="6"></span>
        <span style="--i: 7"><img src="https://picsum.photos/id/51/300/200" alt="7"></span>
        <span style="--i: 8"><img src="https://picsum.photos/id/65/300/200" alt="8"></span>
    </div>

    <div class="btn-container">
        <button class="btn" id="prev">Prev</button>
        <button class="btn" id="next">Next</button>
    </div>
    <script src="app.js"></script>
</body>
</html>

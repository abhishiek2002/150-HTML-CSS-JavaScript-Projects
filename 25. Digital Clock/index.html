<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <p class="brand">Rolex</p>
        <span id="no3">3</span>
        <span id="no6">6</span>
        <span id="no9">9</span>
        <span id="no12">12</span>
        <div class="time hour">
            <div class="hourTick"></div>
        </div>
        <div class="time minute">
            <div class="minuteTick"></div>

        </div>
        <div class="time second">
            <div class="secondTick"></div>

        </div>
        <div class="mid">
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

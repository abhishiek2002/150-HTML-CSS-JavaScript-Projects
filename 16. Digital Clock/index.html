<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">

        <h2 class="heading">DIGITAL CLOCK</h2>

        <div class="timer">

            <div class="hours">
                <h1 id="hour-time">09</h1>
                <span>HOURS</span>
            </div>

            <div class="minutes">
                <h1 id="minute-time">04</h1>
                <span>MINUTES</span>
            </div>

            <div class="seconds">
                <h1 id="second-time">01</h1>
                <span>SECONDS</span>
            </div>
            <span id="ampm">AM</span>

        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
